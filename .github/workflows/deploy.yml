name: Test & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/routes.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 从 Secrets 注入配置生成 wrangler.toml
        run: |
          test -n "${{ secrets.KV_NAMESPACE_ID }}" || { echo "缺少 secret: KV_NAMESPACE_ID"; exit 1; }
          test -n "${{ secrets.WORKER_TOKEN }}" || { echo "缺少 secret: WORKER_TOKEN"; exit 1; }
          sed -i "s/__KV_ID__/${{ secrets.KV_NAMESPACE_ID }}/" wrangler.toml
          sed -i "s/__WORKER_TOKEN__/${{ secrets.WORKER_TOKEN }}/" wrangler.toml
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  purge-cdn:
    # jsDelivr 对 @main 分支缓存最长 12h,且数据层多副本短时间内可能返回不同版本;
    # 必须先确认 CDN 已拿到新版本再 purge,否则会把旧版本重新刷进边缘节点
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 等待 jsDelivr 同步新版本后 purge
        run: |
          VER=$(grep -m1 '@version' userscript/web-inbox.user.js | awk '{print $3}')
          URL="https://cdn.jsdelivr.net/gh/MuYukk1/web-inbox-worker@main/userscript/web-inbox.user.js"
          for i in $(seq 1 8); do
            sleep 60
            GOT=$(curl -fsS "$URL" | grep -m1 '@version' | awk '{print $3}' || true)
            echo "第 $i 次检查: CDN 返回 ${GOT:-无}, 期望 $VER"
            if [ "$GOT" = "$VER" ]; then
              curl -fsS --retry 3 "https://purge.jsdelivr.net/gh/MuYukk1/web-inbox-worker@main/userscript/web-inbox.user.js" | grep -q '"throttled": *false'
              echo "已确认 v$VER 并 purge 完成"
              exit 0
            fi
          done
          echo "::warning::jsDelivr 8 分钟内未同步到 v$VER,本次跳过 purge 避免刷新到旧版本;CDN 会自然过期更新"
