name: Test & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/routes.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 从 Secrets 注入配置生成 wrangler.toml
        run: |
          test -n "${{ secrets.KV_NAMESPACE_ID }}" || { echo "缺少 secret: KV_NAMESPACE_ID"; exit 1; }
          test -n "${{ secrets.WORKER_TOKEN }}" || { echo "缺少 secret: WORKER_TOKEN"; exit 1; }
          sed -i "s/__KV_ID__/${{ secrets.KV_NAMESPACE_ID }}/" wrangler.toml
          sed -i "s/__WORKER_TOKEN__/${{ secrets.WORKER_TOKEN }}/" wrangler.toml
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  purge-cdn:
    # jsDelivr 对 @main 分支缓存最长 12h,push 后主动刷新让油猴脚本尽快拿到更新
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Purge jsDelivr cache
        run: |
          sleep 60  # 等 jsDelivr 数据层同步新 commit
          curl -fsS --retry 3 --retry-delay 30 \
            "https://purge.jsdelivr.net/gh/MuYukk1/web-inbox-worker@main/userscript/web-inbox.user.js" \
            | tee /dev/stderr | grep -q '"throttled": *false'
